        run: bash hardware/pqc-rtl/run_integration_dilithium_verify_negative_sig.sh
      - name: Run Verify negative-pubkey test (yhden bitin muutos julkisessa avaimessa -> verify_ok=0)
        run: bash hardware/pqc-rtl/run_integration_dilithium_verify_negative_pk.sh
      - name: Run Verify multi-seed test (kolme riippumatonta satunnaista avainparia -> verify_ok=1 kaikille)
        run: bash hardware/pqc-rtl/run_integration_dilithium_verify_multiseed.sh

  test-pqc-rtl-verilator-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y verilator
      - name: Lint every rtl/*.sv file, fail on any LATCH/UNDRIVEN/COMBDLY warning
        run: |
          cd hardware/pqc-rtl
          fail=0
          for f in rtl/*.sv; do
            out=$(verilator --lint-only -Wall "$f" 2>&1 || true)
            hits=$(echo "$out" | grep -i "LATCH\|UNDRIVEN\|COMBDLY" || true)
            if [ -n "$hits" ]; then
              echo "LATCH/UNDRIVEN/COMBDLY warning in $f:"
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

  test-pqc-rtl-yosys-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y yosys
      - name: Synthesize NTT core (pqc_ntt_stage_banked + lane_fsm)
