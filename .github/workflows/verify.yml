name: verify

on:
  push:
  pull_request:

jobs:
  test-lex-resiliens-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Test wem_bridge (R/S derivation from WEM §12 fields)
        run: |
          cd concept/lex-resiliens/framework/wem_bridge
          python -m pytest test_wem_to_lr.py -v

      - name: Test generic_bridge (domain-agnostic trust log + golden runner)
        run: |
          cd concept/lex-resiliens/framework/generic_bridge
          python -m pytest test_generic_bridge.py -v

      - name: Install docgen dependencies
        run: pip install pyyaml jinja2

      - name: Test docgen engine (facts/formulas -> document, no hand-typed numbers)
        run: |
          cd concept/lex-resiliens/docgen
          python -m pytest test_engine.py -v
          python build.py

  # VAIHE2-ENNAKKO K2: Googlen attestaatiojuuret = kiinnitetty joukko.
  android-roots-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Virallinen juurilista vs. kiinnitetty
        run: python3 pi2_trust_server/tools/android_roots.py check pi2_trust_server/core/trustcore/android_roots.json

  # Vaihe 2 (docs/VAIHE2-ENNAKKO.md): Android-todisteen todentaja.
  # K7: Googlen android-key-attestation (f9846cd) ulkoisena mittapuuna.
  test-android-vaihe2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install build deps for liboqs
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build build-essential libssl-dev
      - name: Build minimal liboqs (ML-DSA-65 only)
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs && mkdir build && cd build
          cmake -GNinja -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release ..
          ninja -j$(nproc)
          sudo ninja install
          sudo ldconfig
      - name: Install Python deps
        run: pip install liboqs-python cryptography cbor2 fastapi
      - name: Kiinnitetyt lähteet (Google f9846cd, Auditor-näytteet b7f2d29)
        run: |
          for spec in "google/android-key-attestation f9846cd019289f1788cec65b062d9f81c0c4884c aka" \
                      "dbaxa/AttestationSamples b7f2d294b987281ad24276eea537127c8072fc4c auditor"; do
            set -- $spec
            git init -q "$RUNNER_TEMP/$3" && cd "$RUNNER_TEMP/$3"
            git fetch -q --depth 1 "https://github.com/$1" "$2" && git checkout -q FETCH_HEAD
            test "$(git rev-parse HEAD)" = "$2"
            cd "$GITHUB_WORKSPACE"
          done
      - name: K4-K9 synteettiset ketjut (negatiivikontrollit + positiivinen)
        run: cd pi2_trust_server && python3 tests/android/test_vaihe2.py
      - name: Oikeat ketjut (K1, K3)
        run: |
          cd pi2_trust_server
          python3 tests/android/reference_compare.py layout "$RUNNER_TEMP/refchains" "$RUNNER_TEMP/aka" "$RUNNER_TEMP/auditor"
          python3 tests/android/test_vaihe2_real.py "$RUNNER_TEMP/refchains" "$RUNNER_TEMP/aka/src/test/resources/status.json"
      - name: K7 Googlen jäsennin vs. oma
        run: |
          cd pi2_trust_server/tests/android/google_ref
          mkdir -p src/main/java/com/google/android/attestation
          cp "$RUNNER_TEMP"/aka/src/main/java/com/google/android/attestation/*.java src/main/java/com/google/android/attestation/
          mvn -B -q package dependency:copy-dependencies -DoutputDirectory=target/lib
          java -cp "target/classes:target/lib/*" ref.Main "$RUNNER_TEMP/refchains" > "$RUNNER_TEMP/google.jsonl"
          cd ../../..
          python3 tests/android/reference_compare.py ours "$RUNNER_TEMP/refchains" > "$RUNNER_TEMP/ours.jsonl"
          python3 tests/android/reference_compare.py compare "$RUNNER_TEMP/ours.jsonl" "$RUNNER_TEMP/google.jsonl"
          python3 tests/android/reference_compare.py selftest "$RUNNER_TEMP/ours.jsonl" "$RUNNER_TEMP/google.jsonl"

  # Vaihe 3a (docs/VAIHE3-ENNAKKO.md S1-S4): Android-sovellus.
  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install build deps for liboqs
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build build-essential libssl-dev
      - name: Build minimal liboqs (ML-DSA-65 only)
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs && mkdir build && cd build
          cmake -GNinja -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release ..
          ninja -j$(nproc)
          sudo ninja install
          sudo ldconfig
      - name: Install Python deps
        run: pip install liboqs-python cbor2 cryptography
      - name: S1 kultaiset vektorit ajan tasalla (Python = lähde)
        run: |
          cd pi2_trust_server
          python3 tests/android/app_vectors.py gen "$RUNNER_TEMP/golden.txt"
          diff "$RUNNER_TEMP/golden.txt" ../android/app/src/test/resources/golden.txt
      - name: Avainsäilö salaisuudesta (jos asetettu)
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 puuttuu: APK jää allekirjoittamatta (S3 ei täyty)"
          fi
      - name: S1/S3 yksikkötestit, lint, release-rakennus
        run: gradle -p android --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: S2 Kotlinin ML-DSA ja CBOR todentajan koodilla (liboqs)
        run: cd pi2_trust_server && python3 tests/android/app_vectors.py check ../android/app/build/aether-vectors
      - name: S4 ainoa oikeus INTERNET
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT2" dump permissions "$APK" | tee perms.txt
          grep -o "name='[^']*'" perms.txt | sort -u > names.txt
          cat names.txt
          test "$(cat names.txt)" = "name='android.permission.INTERNET'"
      - name: APK:n sha256 ja artefakti
        run: sha256sum android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aether-attest-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - name: S3 allekirjoitettu pysyvällä avaimella
        run: |
          test -n "$ANDROID_KEYSTORE_FILE" || { echo "S3 ei täyty: allekirjoitusavain puuttuu (ANDROID_KEYSTORE_B64)"; exit 1; }
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "sha-256 digest"

  # K9 (docs/VAIHE1-ENNAKKO.md): todentajan ja attestoijan trustcore on yksi lähde.
  trustcore-copies-identical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pi2- ja pi5-trustcore ovat identtiset
        run: diff -r -x __pycache__ pi2_trust_server/core/trustcore pi5_edge_node/core/trustcore

  test-client-tpm-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps for liboqs + tpm2-tools + swtpm
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build build-essential libssl-dev tpm2-tools swtpm
      - name: Build minimal liboqs (ML-DSA-65 only)
        run: |
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git
          cd liboqs && mkdir build && cd build
          cmake -GNinja -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" -DOQS_USE_OPENSSL=ON -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release ..
          ninja -j$(nproc)
          sudo ninja install
          sudo ldconfig
      - name: Install Python deps
        run: pip install liboqs-python fastapi uvicorn cbor2 httpx
      - name: Provision swtpm + rajoitetut AK:t (0x81000000, 0x81000001)
        run: |
          cd pi5_edge_node
          bash setup_swtpm.sh
          AK_HANDLE=0x81000001 bash setup_swtpm.sh
      - name: Vaihe 1 hyväksymistesti (K1-K8, negatiivikontrollit)
        run: |
          export TPM2TOOLS_TCTI="swtpm:host=localhost,port=2321"
          cd pi5_edge_node
          python3 test_vaihe1.py
      - name: HTTP e2e (käsinrekisteröinti, /nonce, /verify)
        run: |
          export TPM2TOOLS_TCTI="swtpm:host=localhost,port=2321"
          cd pi5_edge_node
          (TRUSTCORE_DATA_DIR=.trustcore_server uvicorn core.trustcore.server:APP --port 8100 &)
          sleep 3
          TRUSTCORE_DATA_DIR=.trustcore_server python3 test_client_e2e.py

  test-rvv-montgomery:
    # ubuntu-26.04:ssa qemu-user-static on virtuaalipaketti (2026-11-15).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU riscv64 + cross-toolchain
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y qemu-user-static gcc-riscv64-linux-gnu
      - name: Build and run RVV Montgomery reduction (VLEN=256 and VLEN=128)
        run: |
          cd hardware/pqc-rtl/rvv
          bash run_rvv_test.sh

  test-tvm-riscv:
    # ubuntu-26.04:ssa qemu-user-static on virtuaalipaketti (2026-11-15).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QEMU riscv64 + cross-toolchain + TVM
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y qemu-user-static gcc-riscv64-linux-gnu
          pip install apache-tvm
      - name: Build model, cross-compile, run under QEMU
        run: |
          cd hardware/pqc-rtl/tvm-riscv
          bash run_tvm_test.sh

  test-oqs-rvv-provider-skeleton:
    # ubuntu-26.04:ssa qemu-user-static on virtuaalipaketti (2026-11-15).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU riscv64 + cross-toolchain
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y qemu-user-static gcc-riscv64-linux-gnu
      - name: Build OpenSSL libcrypto for RISC-V (cross), then provider skeleton, run under QEMU
        run: |
          cd hardware/pqc-rtl/oqs-rvv-provider
          bash run_provider_test.sh

  test-rvv-dilithium-ntt:
    # ubuntu-26.04:ssa qemu-user-static on virtuaalipaketti (2026-11-15).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU riscv64 + cross-toolchain
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y qemu-user-static gcc-riscv64-linux-gnu
      - name: Build reference, extract zetas, build RVV, run under QEMU
        run: |
          cd hardware/pqc-rtl/rvv-dilithium
          bash run_ntt_test.sh

  run-pqc-rtl-m1-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: Run M1 RTL verification (real simulation, not a text check)
        run: bash hardware/pqc-rtl/run_m1_test.sh

  test-pqc-rtl-m3-golden-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full ML-KEM golden-model end-to-end regression (1000 random seeds)
        run: |
          cd hardware/pqc-rtl
          python3 m2-golden/mlkem_regression.py 1000

  test-pqc-rtl-m3-kpke-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: Run full K-PKE KeyGen->Encrypt->Decrypt->m round-trip (real RTL, all primitives)
        run: bash hardware/pqc-rtl/run_m3_kpke_roundtrip_test.sh

  test-pqc-rtl-m3-mlkem-decaps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: Run ML-KEM.Decaps_internal TB A (K-PKE.Decrypt + G)
        run: bash hardware/pqc-rtl/run_m3_mlkem_decaps_a_test.sh
      - name: Run ML-KEM.Decaps_internal TB B (K-PKE.Encrypt + FO selection, incl. implicit rejection)
        run: bash hardware/pqc-rtl/run_m3_mlkem_decaps_b_test.sh
      - name: Decaps Phase B -ydin, valivaiheet ja FO-valinta (KORJAUSLISTA A11)
        run: bash hardware/pqc-rtl/run_m4_decaps_b_core_test.sh

  test-pqc-rtl-m3-keygen-multiseed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: Run K-PKE.KeyGen 10x in same simulation (register-leak/reset check)
        run: bash hardware/pqc-rtl/run_m3_kpke_keygen_multiseed_test.sh

  test-pqc-rtl-m4-tau-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: Run M4-TAU-001 end-to-end (ECU->Wishbone->KeyGen->audit-loki->ECU, success path)
        run: bash hardware/pqc-rtl/run_m4_tau_integrated_test.sh
      - name: Run M4-TAU-001 watchdog interrupt path (heartbeat loss mid-KeyGen -> audit log)
        run: bash hardware/pqc-rtl/run_m4_tau_watchdog_interrupt_test.sh
      - name: Run M4-TAU-001 audit log AUDIT_WORD_SEL multi-word regression
        run: bash hardware/pqc-rtl/run_m4_tau_audit_multiword_test.sh
      - name: Run M4-DECAPS Wishbone integration (fresh independent test vector)
        run: bash hardware/pqc-rtl/run_m4_tau_decaps_wishbone_test.sh
      - name: Run M4-DECAPS own audit events (STARTED+COMPLETED)
        run: bash hardware/pqc-rtl/run_m4_tau_decaps_audit_test.sh
      - name: Run M4-ENCAPS Wishbone integration (fresh independent test vector)
        run: bash hardware/pqc-rtl/run_m4_tau_encaps_wishbone_test.sh
      - name: Run M4-ENCAPS own audit events (STARTED+COMPLETED)
        run: bash hardware/pqc-rtl/run_m4_tau_encaps_audit_test.sh
      - name: Run full ML-KEM protocol chain (KeyGen->Encaps->Decaps, shared secret match, random input)
        run: bash hardware/pqc-rtl/run_m4_tau_full_protocol_test.sh

  test-pqc-rtl-reporting-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tarkista elavat referenssidokumentit kielletyista ilmauksista (ks. REPORTING-DISCIPLINE.md)
        run: bash hardware/pqc-rtl/check_reporting_discipline.sh

  # NIST ACVP -vektorit jatkuvana regressiona (lisatty 2026-10-02).
  # Aiemmin nama olivat kerta-ajoja: tulos kirjattiin statusdokumenttiin,
  # mutta RTL-muutos ei olisi paljastanut rikkoutumista.
  test-pqc-rtl-acvp-mlkem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: ML-KEM-512 vs. NIST ACVP (KeyGen 1, Encaps 3, Decaps 5) + negatiivikontrollit
        run: bash hardware/pqc-rtl/run_acvp_mlkem.sh

  # Synteesikelpoiset ML-KEM-ytimet (keygen_core, encaps_top, decaps_top)
  # vs. kaikki NIST ACVP -tapaukset, K=2 ja K=3 (lisatty 2026-11-15).
  # --verify-source: vektorit generoidaan uudelleen kiinnitetysta
  # NIST-commitista ja verrataan repossa oleviin.
  test-pqc-rtl-acvp-mlkem-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        pset: ["512", "768"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: ML-KEM-${{ matrix.pset }} vs. NIST ACVP (KeyGen 25, Encaps 25, Decaps 10) + negatiivikontrollit
        run: bash hardware/pqc-rtl/run_acvp_mlkem_full.sh ${{ matrix.pset }} --verify-source
      - name: TAU-kehys Wishbonen kautta, K=${{ matrix.pset == '512' && '2' || '3' }} (KeyGen->Encaps->Decaps)
        run: |
          cd hardware/pqc-rtl
          source tau_common_files.sh
          K=${{ matrix.pset == '512' && '2' || '3' }}
          compile_tau sim/fp_k$K fpga/tau/pqc_tau_full_protocol_tb.sv -P pqc_tau_full_protocol_tb.K=$K
          out=$(vvp sim/fp_k$K); echo "$out" | tail -3
          echo "$out" | grep -q "^PASS: KOKO ML-KEM-PROTOKOLLA"

  # B8: Decapsin ajoitus- ja toggle-otos regressiona (sivukanava/B8-ENNAKKO.md).
  # Epaonnistuu, jos H1, H2, H4 tai H5 hylataan, tai jos mittari ei havaitse
  # kolmea tarkoituksella vuotavaa muunnelmaa.
  test-pqc-rtl-b8-sivukanava:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: vvp-kaare kaytossa
        run: which vvp | grep -q vvp-tarkka
      - name: B8 K=2 ja K=3 (130 ajoitusajoa, 18 toggle-ajoa)
        run: bash hardware/pqc-rtl/run_b8_sivukanava.sh --vaadi
      - name: B8-negatiivikontrollit (L1, L2, L3)
        run: bash hardware/pqc-rtl/sivukanava/b8_negkontrollit.sh

  # Orkestrointiytimien Verilator-lint (virheet, ei varoitukset), K=2 ja K=3.
  test-pqc-rtl-verilator-lint-tau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y verilator
      - name: Lint pqc_tau_integrated_wrapper (K=2, K=3)
        run: |
          cd hardware/pqc-rtl
          source tau_common_files.sh
          for K in 2 3; do
            verilator --lint-only -Wno-fatal --top-module pqc_tau_integrated_wrapper -GK=$K $TAU_RTL_FILES
          done

  test-pqc-rtl-acvp-dilithium:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y iverilog
      - name: vvp-tarkka PATHiin (tiedostovirhe = FAIL, KORJAUSLISTA A13)
        run: echo "$GITHUB_WORKSPACE/hardware/pqc-rtl/tools/vvp-tarkka" >> "$GITHUB_PATH"
      - name: ML-DSA-65 vs. NIST ACVP (KeyGen tcId=26, Verify tcId=140)
        run: bash hardware/pqc-rtl/run_acvp_dilithium.sh

  # Asennusskripti: install.sh:n taytyy tuottaa ymparisto, jossa ML-DSA-65
  # toimii. Muut Pi-testit rakentavat liboqs:n kasin eivatka siksi
  # paljastaneet, etta requirements.txt:sta puuttui PQC-riippuvuus.
  test-pi-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build build-essential libssl-dev
      - name: Negatiivikontrolli - install.sh keskeytyy ilman tpm2-toolsia
        run: |
          cd pi2_trust_server
          if command -v tpm2_checkquote; then echo "tpm2-tools jo asennettu, kontrolli ei mittaa mitään"; exit 1; fi
          if bash install.sh > out.txt 2>&1; then cat out.txt; echo "install.sh meni läpi ilman tpm2-toolsia"; exit 1; fi
          grep -q "tpm2_checkquote puuttuu" out.txt
      - name: Install tpm2-tools
        run: sudo apt-get -o Acquire::Retries=5 install -y tpm2-tools
      - name: Run pi2_trust_server/install.sh (rakentaa liboqs:n, ajaa itsetestin)
        run: |
          cd pi2_trust_server
          bash install.sh
      - name: Asennettu venv allekirjoittaa ja verifioi ML-DSA-65:lla
        run: |
          cd pi2_trust_server
          .venv/bin/python -c "
          import oqs
          with oqs.Signature('ML-DSA-65') as s:
              pk = s.generate_keypair(); sig = s.sign(b'ci')
          with oqs.Signature('ML-DSA-65') as v:
              assert v.verify(b'ci', sig, pk)
          print('ML-DSA-65 ok')"
      - name: pi2- ja pi5-asennusskriptit ovat samat
        run: cmp pi2_trust_server/install_liboqs.sh pi5_edge_node/install_liboqs.sh

